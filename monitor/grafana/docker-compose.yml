version: '3'

networks:
  prometheus:
    external: true
    name: prometheus

services:
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - 3000:3000
    volumes:
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    restart: unless-stopped
    networks:
      - prometheus
